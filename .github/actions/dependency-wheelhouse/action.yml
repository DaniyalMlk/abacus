name: Dependency wheelhouse
description: >
  Make the server's runtime dependencies resolvable before they exist on a
  package index, by building them from their repositories into a local
  wheelhouse.

# This action is scaffolding with a known end. `pyproject.toml` asks for bounded
# version ranges on each library, which is what a published distribution must carry
# — a `git+https` direct reference is refused on upload, so it cannot be what the
# metadata says. But none of the libraries has a release yet, so an ordinary resolve
# against the index finds nothing.
#
# Building it here and exporting PIP_FIND_LINKS gives every later `pip` call in
# the job somewhere to find it, without threading a flag through each one and
# without weakening the declared requirement. The resolution path is the same one
# an index install takes; only the source of the file differs.
#
# When the libraries are released, delete this directory and every `uses:` line that
# references it. Nothing else in either workflow depends on it.

inputs:
  repositories:
    description: Whitespace-separated repositories to build the dependencies from.
    required: false
    default: >-
      https://github.com/DaniyalMlk/moneyness.git
      https://github.com/DaniyalMlk/shortfall.git
      https://github.com/DaniyalMlk/tenor.git
  wheelhouse:
    description: Directory the built wheel is placed in.
    required: false
    default: /tmp/wheelhouse

runs:
  using: composite
  steps:
    - name: Build the dependencies into a wheelhouse
      shell: bash
      run: |
        python -m pip install --upgrade pip wheel
        for repository in ${{ inputs.repositories }}; do
          # --no-deps because neither library has any, and asking pip to resolve
          # them would send it to the index for packages that need not be there.
          python -m pip wheel --no-deps -w "${{ inputs.wheelhouse }}" \
            "git+$repository"
        done
        ls -l "${{ inputs.wheelhouse }}"

    - name: Point pip at the wheelhouse for the rest of the job
      shell: bash
      run: echo "PIP_FIND_LINKS=${{ inputs.wheelhouse }}" >> "$GITHUB_ENV"
