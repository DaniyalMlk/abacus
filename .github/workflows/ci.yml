name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  conformance:
    name: Conformance over both transports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Over stdio
        # The suite exits non-zero on a failure, so it is a gate rather than a
        # report. Run against the launched entry point, not in process, so the
        # framing is exercised too.
        run: abacus conform --stdio "abacus stdio"
      - name: Over Streamable HTTP
        # Backgrounded and polled: the HTTP-scoped checks are the ones that
        # cover the routing headers and the verbs this revision retired, and
        # they are skipped rather than run without an endpoint to drive.
        run: |
          abacus http --port 8123 &
          # Waiting for the port to answer at all, not for a 2xx: a GET on the
          # endpoint is 405 by design, so `curl -f` here would never succeed and
          # the loop would silently spin out its whole budget before carrying on.
          for _ in $(seq 1 40); do
            curl -s -o /dev/null http://127.0.0.1:8123/mcp && break
            sleep 0.25
          done
          abacus conform --http http://127.0.0.1:8123/mcp

  skill:
    name: The skill describes the server that exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # A separate job from the test matrix so that a failure here reads as what
      # it is. Documentation that names a renamed tool, or a worked example whose
      # arguments no longer validate, is worse than none: it is confidently
      # wrong, and a model calling it has no way to tell.
      - name: The skill, its transcripts and the surface budget
        run: pytest tests/test_skill.py -q

  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy --strict
      - name: Lint
        run: ruff check .

  package:
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      # The same reading of the metadata the index performs on upload, and the
      # check that would have caught the direct-reference requirement that made
      # this project unpublishable.
      - name: Check the metadata the index will read
        run: python -m twine check --strict dist/*
      # The point of this step is the resolution, not the import: pip is given
      # the distribution name and has to find `moneyness` by itself, exactly as
      # it would for someone running `pip install abacus-mcp`.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/pip list | grep -E '^moneyness '
      - name: The entry point runs and answers a request
        # A wheel that imports but cannot answer a request is not a working
        # server, so the check drives one through the stdio transport.
        run: |
          /tmp/check/bin/abacus --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | /tmp/check/bin/abacus stdio \
            | python -c "import sys, json; r = json.load(sys.stdin)['result']; assert r['supportedVersions'] == ['2026-07-28'], r; print('discover ok')"
      - name: The installed wheel passes the conformance suite
        run: /tmp/check/bin/abacus conform --stdio "/tmp/check/bin/abacus stdio"
      # The metadata assertions read License-Expression, License-File,
      # Requires-Dist and the classifiers out of dist-info. In the jobs above
      # that dist-info belongs to an editable install, written once and capable
      # of agreeing with a pyproject.toml that has since changed. Here it is the
      # artefact that would actually be published.
      - name: The metadata tests run against the installed wheel
        run: |
          /tmp/check/bin/pip install pytest
          /tmp/check/bin/python -m pytest tests/test_metadata.py -q
      # The sdist is built by a different code path from the wheel, and a file
      # left out of one can be present in the other: py.typed and LICENSE both
      # arrive by mechanisms that apply to only one of the two. The sdist is also
      # what an index serves where no wheel matches.
      - name: The sdist installs into a clean environment and serves
        run: |
          python -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install dist/*.tar.gz
          /tmp/from-sdist/bin/abacus --version
          /tmp/from-sdist/bin/abacus conform --stdio "/tmp/from-sdist/bin/abacus stdio"
