[build-system]
# 77 is the floor for the SPDX `license` expression and `license-files` below.
# Anything older reads `license = "MIT"` as a legacy table and fails the build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is not the import name. `abacus` was taken on the index
# by an unrelated project; `abacus-mcp` was free, and it says what this is.
# Renaming the Python package to match would have changed every import for the
# sake of a registry collision.
name = "abacus-mcp"
version = "0.1.0"
description = "An MCP server exposing option and portfolio analytics over a validated numerical core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniyal" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "options",
    "greeks",
    "implied-volatility",
    "portfolio-risk",
    "quantitative-finance",
    "llm-tools",
]
# No `License ::` classifier: it is mutually exclusive with the SPDX expression
# above, and supplying both is an error rather than a duplication.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# An ordinary version range, not a direct URL. A `name @ git+https://...`
# requirement installs locally and is rejected outright on upload to a package
# index, which is the single reason this project could not be published at all.
# Two of these are named for the distribution rather than for the module they
# provide: `slippage` and `holdout` on the index belong to unrelated projects, so
# those libraries publish as `slippage-tca` and `holdout-backtest` while their
# import names stay as they are. A requirement is a distribution name, so this is
# the name that belongs here, and `import slippage` in the code below is correct
# at the same time.
dependencies = [
    "moneyness>=0.1,<0.2",
    "shortfall>=0.1,<0.2",
    "tenor>=0.1,<0.2",
    "slippage-tca>=0.1,<0.2",
    "holdout-backtest>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/DaniyalMlk/abacus"
Source = "https://github.com/DaniyalMlk/abacus"
Issues = "https://github.com/DaniyalMlk/abacus/issues"

[project.scripts]
abacus = "abacus.cli:main"
# An alias under the distribution name, for the sake of one command. `uvx <name>`
# runs the console script whose name matches the distribution, so without this
# `uvx abacus-mcp stdio` fails and the incantation becomes
# `uvx --from abacus-mcp abacus stdio` — which is what a client configuration
# would then have to carry, for no reason a reader could see. Both names reach the
# same entry point.
abacus-mcp = "abacus.cli:main"

[project.optional-dependencies]
# The server itself depends only on moneyness, which in turn has no
# dependencies. Everything below is for checking the code, not running it.
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Deliberately not pinned to one version. Pinning it makes mypy read the
# installed stubs as though they were written for that version, and numpy's
# stubs use a `type` statement that is a syntax error below 3.12 — so a pin of
# 3.11 fails on a 3.12 interpreter, on a file nobody here wrote. Left unset,
# mypy checks against whatever it is running on, which is the version being
# tested anyway.
strict = true
files = ["src", "tests"]
warn_unreachable = true

# `tomllib` entered the standard library in 3.11, and mypy resolves imports
# against the interpreter it is run under. The metadata tests' guarded
# `import tomllib` — behind a skipif on the same version — is the only mention
# of it in the tree, and on 3.10 it would otherwise be an unresolvable import.
[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
